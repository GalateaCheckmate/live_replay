name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/android-live-replay-apk
    paths:
      - 'tauri-app/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/patch-android-runtime.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: build-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64-phone
            tauri_target: aarch64
            rust_target: aarch64-linux-android
          - label: x86_64-emulator
            tauri_target: x86_64
            rust_target: x86_64-linux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Initialize Tauri Android project
        working-directory: tauri-app
        run: npm run tauri -- android init --ci

      - name: Apply Android runtime tuning
        run: python3 scripts/patch-android-runtime.py

      - name: Build installable debug APK
        working-directory: tauri-app
        run: npm run tauri -- android build --debug --apk --target ${{ matrix.tauri_target }}

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist/android
          find tauri-app/src-tauri/gen/android -type f -name '*.apk' -print -exec cp {} dist/android/ \;
          test -n "$(find dist/android -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: live-replay-android-${{ matrix.label }}-debug
          path: dist/android/*.apk
          if-no-files-found: error
