name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/android-live-replay-apk
    paths:
      - 'tauri-app/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/patch-android-runtime.py'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: build-${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: arm64-phone
            tauri_target: aarch64
            rust_target: aarch64-linux-android
            apk_name: Live-Replay-Android-ARM64.apk
          - label: x86_64-emulator
            tauri_target: x86_64
            rust_target: x86_64-linux-android
            apk_name: Live-Replay-Android-x86_64-Emulator.apk

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-app/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        working-directory: tauri-app
        run: npm ci

      - name: Initialize Tauri Android project
        working-directory: tauri-app
        run: npm run tauri -- android init --ci

      - name: Apply Android runtime tuning
        run: python3 scripts/patch-android-runtime.py

      - name: Build installable debug APK
        working-directory: tauri-app
        run: npm run tauri -- android build --debug --apk --target ${{ matrix.tauri_target }}

      - name: Collect and rename APK
        shell: bash
        run: |
          mkdir -p dist/android
          APK_PATH="$(find tauri-app/src-tauri/gen/android -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" "dist/android/${{ matrix.apk_name }}"
          test -s "dist/android/${{ matrix.apk_name }}"
          ls -lh "dist/android/${{ matrix.apk_name }}"

      # GitHub Actions artifacts are ZIP containers by design. Keep them only as an internal
      # hand-off between jobs; the user-facing downloads are raw .apk Release assets below.
      - name: Stage APK for release
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/android/${{ matrix.apk_name }}
          if-no-files-found: error
          retention-days: 2

  publish-apk:
    name: publish-raw-apk
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify release APKs
        shell: bash
        run: |
          test -s release-assets/Live-Replay-Android-ARM64.apk
          test -s release-assets/Live-Replay-Android-x86_64-Emulator.apk
          ls -lh release-assets/*.apk

      - name: Publish raw APK files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep one rolling pre-release so the newest APK is always obvious and downloadable
          # directly as .apk instead of GitHub's ZIP-wrapped Actions artifact.
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create android-latest \
            release-assets/Live-Replay-Android-ARM64.apk \
            release-assets/Live-Replay-Android-x86_64-Emulator.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Live Replay Android Latest" \
            --prerelease \
            --notes "自动构建的 Android 测试版。ARM64 用于安卓真机，x86_64 用于模拟器。Build: $GITHUB_RUN_NUMBER · Commit: $GITHUB_SHA"
