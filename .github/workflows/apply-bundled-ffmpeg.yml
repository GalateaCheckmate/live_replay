name: Apply bundled FFmpeg fix

# One-shot source updater. Remove after the source patch lands.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-bundled-ffmpeg.yml

permissions:
  contents: write

concurrency:
  group: live-replay-source-update
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bundled FFmpeg changes
        run: python tools/apply_bundled_ffmpeg.py

      - name: Remove one-shot updater script
        run: rm tools/apply_bundled_ffmpeg.py

      - name: Commit source update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: bundle ffmpeg for portable replay remux"
          git push origin HEAD:main
