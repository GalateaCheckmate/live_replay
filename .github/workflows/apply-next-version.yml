name: Apply next version

on:
  push:
    branches:
      - main
    paths:
      - .github/next-version-trigger

permissions:
  contents: write

concurrency:
  group: live-replay-next-version
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply requested defaults and simplified workflow
        run: python tools/apply_next_version.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Remove one-shot updater and trigger Full
        shell: bash
        run: |
          rm -f tools/apply_next_version.py
          rm -f .github/workflows/apply-next-version.yml
          rm -f .github/next-version-trigger
          printf 'Run simplified Live Replay defaults and UI validation.\nTriggered: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/full-trigger

      - name: Commit final next version
        shell: bash
        run: |
          git config user.name "GalateaCheckmate"
          git config user.email "jasonli4165@gmail.com"
          git add -A
          git commit -m "feat: simplify Live Replay around one streamer switch"
          git push origin HEAD:main
