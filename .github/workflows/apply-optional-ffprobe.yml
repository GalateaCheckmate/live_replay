name: Apply optional ffprobe fallback

on:
  push:
    branches:
      - main
    paths:
      - .github/optional-ffprobe-trigger

permissions:
  contents: write

concurrency:
  group: live-replay-optional-ffprobe
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply fallback
        run: python tools/apply_optional_ffprobe.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Format Rust
        run: cargo fmt --all

      - name: Compile workspace
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets --locked

      - name: Prepare source-only commit
        shell: bash
        run: |
          rm -f tools/apply_optional_ffprobe.py
          rm -f .github/optional-ffprobe-trigger

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "GalateaCheckmate"
          git config user.email "jasonli4165@gmail.com"
          git add -A
          git commit -m "fix: make ffprobe optional for portable uploads"
          git push origin HEAD:main
