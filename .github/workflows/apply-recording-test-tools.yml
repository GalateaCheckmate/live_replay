name: Apply recording test tools

on:
  push:
    branches:
      - main
    paths:
      - .github/recording-test-tools-trigger

permissions:
  contents: write

concurrency:
  group: live-replay-recording-test-tools
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply changes
        run: python tools/apply_recording_test_tools.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Format Rust
        run: cargo fmt --all

      - name: Compile workspace
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets --locked

      - name: Prepare source-only commit
        shell: bash
        run: |
          # full.yml is committed separately with the GitHub connector because
          # GITHUB_TOKEN cannot modify another workflow file without workflows permission.
          git checkout -- .github/workflows/full.yml
          rm -f tools/apply_recording_test_tools.py
          rm -f .github/recording-test-tools-trigger

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "GalateaCheckmate"
          git config user.email "jasonli4165@gmail.com"
          git add -A
          git commit -m "feat: add live recording stats and immediate upload test action"
          git push origin HEAD:main
