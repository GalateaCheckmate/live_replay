name: Apply Windows reliability hardening

on:
  push:
    paths:
      - .github/workflows/apply-windows-reliability.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded reliability patch
        run: python scripts/apply_windows_reliability_patch.py

      - name: Normalize and validate diff
        run: |
          cargo fmt --all
          git diff --check

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app crates
          git commit -m "fix: harden Windows recording and upload reliability"
          git push origin HEAD:main
