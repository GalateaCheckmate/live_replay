name: Fix Quick build

on:
  push:
    branches:
      - main
    paths:
      - .github/fix-quick-trigger

permissions:
  contents: write

concurrency:
  group: live-replay-fix-quick
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Fix ambiguous insert and warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/biliup-cli/src/server/api/endpoints.rs')
          text = path.read_text(encoding='utf-8')
          start = '    let upload = InsertUploadStreamer {\n'
          if start not in text:
              raise SystemExit('simple upload insert start not found')
          text = text.replace(
              start,
              '    let upload = ormlite::Insert::insert(\n        InsertUploadStreamer {\n',
              1,
          )
          marker = '    }\n    .insert(&pool)\n'
          pos = text.find(marker, text.find('let upload = ormlite::Insert::insert'))
          if pos < 0:
              raise SystemExit('simple upload insert suffix not found')
          text = text[:pos] + '        },\n        &pool,\n    )\n' + text[pos + len(marker):]
          path.write_text(text, encoding='utf-8')

          warning_path = Path('crates/biliup-cli/src/server/api/replay_endpoints.rs')
          warning_text = warning_path.read_text(encoding='utf-8')
          warning_text = warning_text.replace('.attach_printable(error.to_string())', '.attach(error.to_string())')
          warning_path.write_text(warning_text, encoding='utf-8')
          PY
          cargo fmt --all

      - name: Remove one-shot files and trigger Full
        shell: bash
        run: |
          rm -f .github/workflows/fix-quick-build.yml
          rm -f .github/fix-quick-trigger
          printf 'Run Quick and Full after fixing ambiguous Insert call.\nTriggered: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .github/full-trigger

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "GalateaCheckmate"
          git config user.email "jasonli4165@gmail.com"
          git add -A
          git commit -m "fix: disambiguate simplified streamer insert"
          git push origin HEAD:main
