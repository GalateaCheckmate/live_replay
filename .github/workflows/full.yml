name: Full

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/full-trigger

permissions:
  contents: read

concurrency:
  group: live-replay-full
  cancel-in-progress: true

jobs:
  full-build:
    name: Windows full build
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: live-replay-windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Normalize Rust formatting
        run: cargo fmt --all

      - name: Test Rust workspace
        env:
          SQLX_OFFLINE: "true"
        run: cargo test --workspace --locked

      - name: Build Windows release
        env:
          SQLX_OFFLINE: "true"
        run: cargo build --release --locked --bin biliup

      - name: Smoke test double-click startup
        shell: pwsh
        run: |
          $smokeDir = Join-Path $PWD 'dist/smoke'
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $exe = (Resolve-Path 'target/release/biliup.exe').Path
          $env:LIVE_REPLAY_NO_BROWSER = '1'
          $process = Start-Process -FilePath $exe -WorkingDirectory $smokeDir -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..60) {
              Start-Sleep -Milliseconds 500
              if ($process.HasExited) {
                throw "live-replay.exe exited before the dashboard started (exit code $($process.ExitCode))"
              }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:19159/' -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # The server is still starting.
              }
            }
            if (-not $ready) {
              throw 'live-replay.exe did not expose the dashboard on port 19159'
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/live-replay | Out-Null
          Copy-Item target/release/biliup.exe dist/live-replay/live-replay.exe
          Copy-Item '启动 Live Replay.bat' 'dist/live-replay/启动 Live Replay.bat'
          Copy-Item LICENSE dist/live-replay/LICENSE
          Copy-Item README.md dist/live-replay/README.md
          Copy-Item LIVE_REPLAY.md dist/live-replay/LIVE_REPLAY.md
          Copy-Item public/config.toml dist/live-replay/config.example.toml

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: live-replay-windows
          path: dist/live-replay/*
          if-no-files-found: error
          retention-days: 14
