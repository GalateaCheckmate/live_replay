name: Apply replay runtime hardening

on:
  push:
    paths:
      - .github/workflows/patch-replay-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply replay runtime patch
        run: python scripts/patch_replay_runtime.py

      - name: Format and validate patch
        run: |
          cargo fmt --all
          git diff --check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates app
          git commit -m "fix: harden replay upload concurrency and credentials"
          git push origin HEAD:main
