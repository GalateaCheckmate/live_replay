name: Quick

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: live-replay-quick
  cancel-in-progress: true

jobs:
  quick-check:
    name: Windows quick check
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: live-replay-windows

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Normalize Rust formatting
        run: cargo fmt --all

      - name: Check Rust workspace
        env:
          SQLX_OFFLINE: "true"
        run: cargo check --workspace --all-targets --locked
