name: Apply Replay Static Patch

on:
  push:
    branches:
      - main
    paths:
      - .github/replay-static-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply replay safety patch
        run: python tools/apply_replay_static_fixes.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit patch
        run: |
          git config user.name "GalateaCheckmate"
          git config user.email "jasonli4165@gmail.com"
          git add crates/biliup-cli/src/server/common/replay.rs
          git diff --cached --quiet && { echo "Patch produced no changes"; exit 1; }
          git commit -m "fix: make replay staging and path moves crash-safe"
          git push origin HEAD:main
