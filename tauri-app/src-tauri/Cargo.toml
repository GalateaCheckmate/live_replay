[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["fs", "sync", "time"] }
fs2 = "0.4.3"
tauri-plugin-shell = "2"
live-replay-core = { path = "../../crates/live-replay-core" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-live-replay-android = { path = "plugins/live-replay-android" }

[workspace]
members = ["plugins/live-replay-android"]
